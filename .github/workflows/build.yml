name: Build & Verify

# 用 GitHub 托管的 Xcode 26 验证构建（本地无 Xcode 26 时的替代方案）。
# 构建产物作为 artifact 上传，可直接下载到 macOS 12 机器做真机回归。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Release Build (deployment target 12.0)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcodes
        run: ls /Applications | grep -i xcode

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i macosx

      - name: Build (Release)
        run: |
          xcodebuild -project trackpad_control.xcodeproj \
            -scheme trackpad_control \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build-release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify minimum OS version
        run: |
          APP=build-release/Build/Products/Release/trackpad_control.app
          BIN="$APP/Contents/MacOS/trackpad_control"
          echo "--- binary build metadata ---"
          vtool -show-build "$BIN"
          MINOS=$(vtool -show-build "$BIN" | awk '/minos/ {print $NF}')
          echo "binary minos = $MINOS"
          if [[ "$MINOS" != 12.* ]]; then
            echo "::error::Expected deployment target 12.x, got $MINOS"
            exit 1
          fi
          echo "--- Info.plist LSMinimumSystemVersion ---"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"

      - name: Package app
        run: |
          cd build-release/Build/Products/Release
          zip -r -q "$GITHUB_WORKSPACE/trackpad_control.zip" trackpad_control.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackpad_control-${{ github.sha }}
          path: trackpad_control.zip
          retention-days: 14
