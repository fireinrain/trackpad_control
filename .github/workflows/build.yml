name: Build & Verify

# 用 GitHub 托管的 Xcode 26 验证构建（本地无 Xcode 26 时的替代方案）。
# 构建产物作为 artifact 上传，可直接下载到 macOS 12 机器做真机回归。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Release Build (deployment target 12.0)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcodes
        run: ls /Applications | grep -i xcode

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i macosx

      - name: Build (Release)
        run: |
          set -o pipefail
          # ARCHS forces a universal binary so the artifact runs on both
          # Apple Silicon and Intel Macs (the CI runner itself is arm64 only).
          xcodebuild -project trackpad_control.xcodeproj \
            -scheme trackpad_control \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build-release \
            build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E "(error|warning):" "$GITHUB_WORKSPACE/build.log" \
            | grep -v "^$" | sort -u | head -50 \
            | while IFS= read -r line; do echo "::error::${line:0:400}"; done

      - name: Verify minimum OS version and architectures
        run: |
          APP="build-release/Build/Products/Release/Trackpad Control.app"
          BIN="$APP/Contents/MacOS/Trackpad Control"
          echo "--- binary build metadata ---"
          vtool -show-build "$BIN"
          MINOS=$(vtool -show-build "$BIN" | awk '/minos/ {print $NF}')
          echo "binary minos = $MINOS"
          if [[ "$MINOS" != 12.* ]]; then
            echo "::error::Expected deployment target 12.x, got $MINOS"
            exit 1
          fi
          echo "--- architectures ---"
          LIPO=$(lipo -archs "$BIN")
          echo "$LIPO"
          case "$LIPO" in *x86_64*) : ;; *) echo "::error::Missing x86_64 slice — app would not run on Intel Macs"; exit 1;; esac
          case "$LIPO" in *arm64*) : ;; *) echo "::error::Missing arm64 slice"; exit 1;; esac
          echo "--- Info.plist LSMinimumSystemVersion ---"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"

      - name: Package app
        run: |
          cd build-release/Build/Products/Release
          zip -r -q "$GITHUB_WORKSPACE/trackpad_control.zip" "Trackpad Control.app"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trackpad_control-${{ github.sha }}
          path: trackpad_control.zip
          retention-days: 14
